services:
  gamin-claud-p:
    image: dockurr/windows:latest
    container_name: gamin-claud-p
    environment:
      VERSION: "11"
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "40G"
      USERNAME: "gamer"
      PASSWORD: "123"
      # Si pruebas en un entorno sin KVM (como Codespaces), descomenta la siguiente línea:
      # KVM: "N"
    devices:
      - /dev/kvm
      - /dev/net/tun
      - /dev/dri
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"     # Acceso web directo al escritorio Windows 11
      - "3389:3389/tcp" # RDP (para conectar con mando/audio desde cualquier PC/móvil)
      - "3389:3389/udp"
    volumes:
      - ./windows-data:/storage
      - ./intros:/shared/intros
      - ./oem:/oem
    restart: unless-stopped
    stop_grace_period: 2m
