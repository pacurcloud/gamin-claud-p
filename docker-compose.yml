services:
  gamin-claud-p:
    image: dockurr/windows:latest
    container_name: gamin-claud-p
    environment:
      VERSION: "11"
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "12G"
      USERNAME: "gamer"
      PASSWORD: "123"
      KVM: "N"
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"     # Pantalla web de Windows 11
      - "3389:3389/tcp" # Escritorio Remoto (RDP) con audio y mando
      - "3389:3389/udp"
    volumes:
      - ./windows-data:/storage
      - ./intros:/shared/intros
      - ./oem:/oem
    restart: unless-stopped
    stop_grace_period: 2m
