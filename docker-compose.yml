services:
  gamin-claud-p:
    image: dockurr/windows:latest
    container_name: gamin-claud-p
    environment:
      VERSION: "11"
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "40G"
      USERNAME: "gamer"
      PASSWORD: "123"
      # Si tu entorno (ej. GitHub Codespaces) no tiene /dev/kvm, cambia KVM a "N"
      KVM: "Y"
    devices:
      - /dev/kvm
      - /dev/net/tun
      - /dev/dri
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"     # Pantalla de Windows 11 en el navegador
      - "3389:3389/tcp" # Conexión Escritorio Remoto (RDP) con mando y audio
      - "3389:3389/udp"
    volumes:
      - ./windows-data:/storage
      - ./intros:/shared/intros
      - ./oem:/oem
    restart: unless-stopped
    stop_grace_period: 2m
