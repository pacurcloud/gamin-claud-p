services:
  gamin-claud-p:
    build: .
    container_name: gamin-claud-p
    shm_size: "2gb"
    ports:
      - "8080:8080"     # Pantalla web instantánea (noVNC)
      - "47990:47990"   # Panel web Sunshine (para streaming en PC/servidor con GPU)
    volumes:
      - ./intros:/intros
      - ./scripts:/opt/gamin-claud-p
    restart: unless-stopped
